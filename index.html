<style>:root{--primary:#1e40af;--primary-light:#3b82f6;--danger:#dc2626;--warning:#f59e0b;--success:#059669;--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#1e293b;--text-muted:#64748b;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
.header{background:linear-gradient(135deg,#1e40af,#312e81);color:white;padding:12px 16px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:8px}
.header h1{font-size:16px;font-weight:600}
.header .sub{font-size:10px;opacity:.75;margin-top:1px}
.tab-bar{display:flex;background:var(--card);margin:0 0 10px;border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tab-btn{flex:1;padding:10px 6px;border:none;background:white;font-size:12px;font-weight:500;color:var(--text-muted);cursor:pointer;white-space:nowrap;position:relative}
.tab-btn.active{color:var(--primary);font-weight:600}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:30%;right:30%;height:2px;background:var(--primary);border-radius:2px}
.container{max-width:780px;margin:0 auto;padding:0 12px 80px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:10px 6px;text-align:center;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.stat-card .num{font-size:20px;font-weight:700;line-height:1.2}
.stat-card .label{font-size:10px;color:var(--text-muted);margin-top:2px}
.stat-card.danger .num{color:var(--danger)}
.stat-card.success .num{color:var(--success)}
.search-wrap{position:sticky;top:86px;z-index:40;padding:8px 12px;background:var(--bg);margin:0 -12px}
.search-box{display:flex;gap:8px;background:var(--card);padding:8px 10px;border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.04);align-items:center}
.search-box input{flex:1;border:none;outline:none;font-size:14px;background:transparent}
.filter-scroll{display:flex;gap:6px;overflow-x:auto;padding:6px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-scroll::-webkit-scrollbar{display:none}
.filter-chip{padding:5px 12px;border-radius:16px;border:1px solid var(--border);background:white;font-size:11px;white-space:nowrap;cursor:pointer;color:var(--text-muted);flex-shrink:0}
.filter-chip.active{background:var(--primary);color:white;border-color:var(--primary)}
.project-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.project-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;border-left:3px solid transparent}
.project-card:active{transform:scale(.99)}
.project-card.high{border-left-color:var(--danger)}
.project-card .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.project-card .card-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.4;flex:1}
.project-card .card-deadline{font-size:12px;font-weight:600;margin-bottom:6px}
.project-card .card-deadline.urgent{color:var(--danger)}
.project-card .card-deadline.warning{color:#d97706}
.project-card .card-deadline.normal{color:var(--text-muted)}
.project-card .card-deadline.overdue{color:#94a3b8;text-decoration:line-through}
.project-card .card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.project-card .card-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.project-card .card-detail.open{display:block}
.project-card .detail-row{display:flex;gap:8px;font-size:12px;margin-bottom:6px;line-height:1.5}
.project-card .detail-row .dl{color:var(--text-muted);min-width:65px;flex-shrink:0}
.project-card .expand-hint{font-size:11px;color:var(--primary-light);margin-top:6px;text-align:center}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:500;line-height:1.5}
.badge-high{background:#fef2f2;color:#dc2626}
.badge-mid{background:#fef9c3;color:#a16207}
.badge-open{background:#d1fae5;color:#065f46}
.badge-closed{background:#f1f5f9;color:#94a3b8}
.badge-upcoming{background:#dbeafe;color:#1e40af}
.badge-level{background:#ede9fe;color:#5b21b6}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted);display:none}
.footer{text-align:center;padding:12px;color:var(--text-muted);font-size:10px}
@media (min-width:780px){.container{padding:0 16px 40px}.search-wrap{top:94px}}
</style>
</head>

    "适合申报人": "有生命科学检测平台、组学/流式/成像/细胞质量检测、自动化培养、AI自主实验室或国产仪器企业合作基础的团队；首都干细胞平台可作为应用验证或示范场景储备",
    "申报难度": "中",
    "优先级": "中",
    "官网链接": "https://mis.kw.beijing.gov.cn/",
    "通知链接": "https://kw.beijing.gov.cn/zwgk/zcwj/202605/t20260521_4661077.html",
    "备注": "官方通知显示系统于2026年5月22日12:00开通、2026年6月4日17:30截止；项目不是传统基金，更偏仪器平台验评、应用示范和国产仪器推广。"
  }
];
var currentTab='all', currentCat='', currentKw='';
var now=new Date();

function init() {
  renderStats();
  renderCategories();
  renderProjects();
}

function getDeadline(d,st) {
  if(!d||d==='待定'||d==='待通知') return {cls:'normal',txt:'待通知'};
  var m=d.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m) return {cls:'normal',txt:d.substring(0,12)};
  var dl=new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));
  var diff=Math.ceil((dl-now)/(1000*60*60*24));
  var disp=m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if(st.includes('截止')) return {cls:'overdue',txt:'已截止: '+disp};
  if(diff<0) return {cls:'overdue',txt:'已过期: '+disp};
  if(diff===0) return {cls:'urgent',txt:'今天截止！'};
  if(diff<=3) return {cls:'urgent',txt:disp+'（仅剩'+diff+'天）'};
  if(diff<=14) return {cls:'warning',txt:disp+'（还有'+diff+'天）'};
  return {cls:'normal',txt:'截止: '+disp};
}

function statusBadge(s) {
  if(!s) return '';
  if(s.includes('申报')||s.includes('报名')||s.includes('征求')) return '<span class="badge badge-open">'+s+'</span>';
  if(s.includes('截止')) return '<span class="badge badge-closed">'+s+'</span>';
  if(s.includes('待')||s.includes('未开始')) return '<span class="badge badge-upcoming">'+s+'</span>';
  return s;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderStats() {
  var total=DATA.length, open=0, urgent=0, high=0;
  DATA.forEach(function(p){
    var s=p['当前状态']||'';
    if(s.includes('申报')||s.includes('报名')||s.includes('征求')) open++;
    if(!s.includes('截止')&&(s.includes('申报')||s.includes('报名'))){
      var d=getDeadline(p['截止时间']||'',s);
      if(d.cls==='urgent'||d.cls==='warning') urgent++;
    }
    if(p['优先级']==='高'&&!s.includes('截止')) high++;
  });
  document.getElementById('statsGrid').innerHTML=
    '<div class="stat-card" onclick="switchTab(\'all\',document.querySelector(\'.tab-btn\'))"><div class="num">'+total+'</div><div class="label">全部</div></div>'+
    '<div class="stat-card success" onclick="switchTab(\'open\',document.querySelectorAll(\'.tab-btn\')[1])"><div class="num">'+open+'</div><div class="label">申报中</div></div>'+
    '<div class="stat-card danger" onclick="switchTab(\'urgent\',document.querySelectorAll(\'.tab-btn\')[2])"><div class="num">'+urgent+'</div><div class="label">即将截止</div></div>'+
    '<div class="stat-card" onclick="switchTab(\'high\',document.querySelectorAll(\'.tab-btn\')[3])"><div class="num">'+high+'</div><div class="label">高优先</div></div>';
}

function renderCategories() {
  var cats={};
  DATA.forEach(function(p){ if(p['类别']&&!cats[p['类别']]) cats[p['类别']]=true; });
  document.getElementById('catFilters').innerHTML=Object.keys(cats).map(function(c){
    return '<span class="filter-chip" onclick="toggleCat(''+c.replace(/'/g,"&#39;")+'',this)">'+c+'</span>';
  }).join('');
}

function toggleCat(c,el) {
  if(currentCat===c){ currentCat='';el.classList.remove('active'); }
  else{ currentCat=c;document.querySelectorAll('.filter-chip').forEach(function(x){x.classList.remove('active')});el.classList.add('active'); }
  renderProjects();
}

function switchTab(t,btn) {
  currentTab=t;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.remove('active')});
  currentCat='';
  document.getElementById('searchInput').value='';
  currentKw='';
  renderProjects();
}

function doSearch() {
  currentKw=document.getElementById('searchInput').value.toLowerCase();
  renderProjects();
}

function renderProjects() {
  var list=document.getElementById('projectList');
  var empty=document.getElementById('empty');
  list.innerHTML='';
  var filtered=DATA;

  // Tab filter
  if(currentTab==='open') {
    filtered=filtered.filter(function(p){ var s=p['当前状态']||''; return s.includes('申报')||s.includes('报名')||s.includes('征求'); });
  } else if(currentTab==='urgent') {
    filtered=filtered.filter(function(p){
      var s=p['当前状态']||'';
      if(s.includes('截止')) return false;
      if(!s.includes('申报')&&!s.includes('报名')&&!s.includes('征求')) return false;
      var d=getDeadline(p['截止时间']||'',s);
      return d.cls==='urgent'||d.cls==='warning';
    });
  } else if(currentTab==='high') {
    filtered=filtered.filter(function(p){ return p['优先级']==='高'&&!(p['当前状态']||'').includes('截止'); });
  }

  // Category filter
  if(currentCat) filtered=filtered.filter(function(p){ return p['类别']===currentCat; });

  // Keyword
  if(currentKw) filtered=filtered.filter(function(p){
    return Object.values(p).some(function(v){ return String(v||'').toLowerCase().indexOf(currentKw)!==-1; });
  });

  if(filtered.length===0) { empty.style.display='block'; return; }
  empty.style.display='none';

  filtered.forEach(function(p){
    var isHigh=p['优先级']==='高', isOpen=(p['当前状态']||'').includes('申报')||(p['当前状态']||'').includes('报名');
    var cls='project-card';
    if(isHigh&&isOpen) cls+=' high';
    var d=getDeadline(p['截止时间']||'',p['当前状态']||'');
    var card=document.createElement('div');
    card.className=cls;
    var did='d-'+p['id'].replace(/[^a-zA-Z0-9]/g,'-');
    card.innerHTML=
      '<div class="card-top"><div class="card-name">'+esc(p['名称'])+'</div><div>'+
      (isHigh?'<span class="badge badge-high">高优</span> ':'')+
      (p['级别']&&p['级别'].includes('国家')?'<span class="badge badge-level">国家</span>':'')+
      '</div></div>'+
      '<div class="card-deadline '+d.cls+'">'+d.txt+'</div>'+
      '<div class="card-meta">'+statusBadge(p['当前状态'])+
      '<span style="font-size:11px;color:var(--text-muted);">'+esc(p['类别']||'')+'</span>'+
      '<span style="font-size:11px;color:var(--text-muted);">'+esc((p['适合谁申报']||'').substring(0,20))+'</span>'+
      '</div>'+
      '<div class="card-detail" id="'+did+'">'+buildDetail(p)+'</div>'+
      '<div class="expand-hint" onclick="toggleDetail(''+did+'',event)">查看详情 ▾</div>';
    card.addEventListener('click',function(e){ if(!e.target.classList.contains('expand-hint')) toggleDetail(did,e); });
    list.appendChild(card);
  });
}

function buildDetail(p) {
  var fields=[['主管部门',p['主管部门']],['年龄限制',p['年龄限制']],['核心条件',p['核心条件']],['支持力度',p['支持力度/资助金额']],['适合申报人',p['适合申报人']],['推荐名额',p['单位推荐名额']]];
  if(p['官网链接']) fields.push(['官网链接','<a href="'+esc(p['官网链接'])+'" target="_blank" style="color:var(--primary-light);word-break:break-all;">'+esc(p['官网链接'])+'</a>']);
  if(p['备注']) fields.push(['备注',p['备注']]);
  return fields.filter(function(f){return f[1];}).map(function(f){return '<div class="detail-row"><div class="dl">'+f[0]+'</div><div>'+f[1]+'</div></div>';}).join('');
}

function toggleDetail(did,ev) {
  ev.stopPropagation();
  var el=document.getElementById(did);
  var hint=el.nextElementSibling;
  el.classList.toggle('open');
  if(hint) hint.textContent=el.classList.contains('open')?'收起 ▴':'查看详情 ▾';
}

init();
</script>
</body>
</html>
